name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  security:
    name: Security foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Run tenant-isolation integration tests
        run: npm run test:integration
      - name: Run security regression tests
        run: npm run test:security
      - name: Reject service role in client source
        run: node scripts/security/no-service-role-client.ts
      - name: Reject static dashboard data
        run: node scripts/security/no-static-dashboard-data.ts
      - name: Flag unprotected API routes
        run: node scripts/security/no-unprotected-api-route.ts
      - name: Flag unscoped Supabase queries
        run: node scripts/security/no-unscoped-supabase-query.ts
      - name: Verify tenant-table RLS declarations
        run: node scripts/security/verify-rls-policies.ts
      - name: Security status
        run: echo "Static checks supplement, but do not replace, the behavioral tenant-isolation tests."
