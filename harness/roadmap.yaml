  - INTERNALLY_VALIDATED
  - INTERIM_DOMAIN_BASELINE
  - ORIGINAL_CONSULTANT_CONFIRMED
  - PILOT_VALIDATED
  - CUSTOMER_VALIDATED
phases:
  - id: P0
    name: "Phase 0 - Retail Intelligence, Data and Integration Foundation"
    status: CONDITIONALLY_ACCEPTED
    notes: "Includes historical Phase 0.5 integration/data-foundation milestones. M0.20 is complete; M0.21 is conditionally accepted."
  - id: P1
    name: "Phase 1 - Core Inventory Operating System"
    status: ACCEPTED
    notes: "Inventory core implementation exists and was deployed."
  - id: P2A
    phase: P2
    name: "Phase 2A - Light Merchandising Intelligence and Action Planning"
    status: ACCEPTED
    notes: "M2.0-M2.6 exists and was deployed."
  - id: P2B
    phase: P2
    name: "Phase 2B - Engineering Reconciliation, Domain Validation and Pilot Readiness"
    status: ACCEPTED
    active: true
    notes: "M2.7-M2.11 completed. Stop before M2.12, which requires original consultant or approved domain-review evidence."
  - id: P2C
    phase: P2
    name: "Phase 2C - Full Merchandise Planning Suite"
    status: NOT_STARTED
    notes: "Not approved for implementation."
  - id: P3
    name: "Phase 3 - Store Operations"
    status: NOT_STARTED
  - id: P4
    name: "Phase 4 - Purchasing and Supplier Management"
    status: NOT_STARTED
  - id: P5
    name: "Phase 5 - Warehouse Management System"
    status: NOT_STARTED
  - id: P6
    name: "Phase 6 - Omnichannel and Order Management"
    status: NOT_STARTED
  - id: P7
    name: "Phase 7 - POS"
    status: NOT_STARTED
    human_gate: true
  - id: P8
    name: "Phase 8 - Finance"
    status: NOT_STARTED
  - id: P9
    name: "Phase 9 - Wholesale/B2B"
    status: NOT_STARTED
  - id: P10
    name: "Phase 10 - Intelligent Control Plane"
    status: NOT_STARTED
  - id: P11
    name: "Phase 11 - Platform/Ecosystem/Enterprise"
    status: NOT_STARTED
  - id: P12
    name: "Phase 12 - Optional Retail Network and Embedded Services"
    status: NOT_STARTED
    human_gate: true
history:
  - label: "Phase 0.5"
    current_mapping: "Phase 0 integration/data-foundation history"
    rule: "Preserve in migrations/reports as historical evidence; do not treat as a conflicting current roadmap phase."
strategic_invariants:
  - id: wedge-vs-end-state
    required: true
    statement: "Inventory recovery intelligence is RetailOS's initial wedge, not the final product scope."
    implementation_rule: "Future phases are roadmap context only; existence of a future phase is not implementation authority."
  - id: shared-os-kernel
    required: true
    statement: "Future modules must extend shared identity, tenant isolation, permissions, policy, approvals, workflow states, audit, provenance, events, jobs, attention/tasks, and business-rule versioning instead of reinventing them."
    implementation_rule: "Do not create empty abstractions prematurely; encode and reuse kernel capabilities when the implementation becomes real."
  - id: country-awareness-in-core
    required: true
    statement: "Country, currency, locale, timezone, pricing mode, tax mode/configuration, operating calendar, and location semantics must remain core-capable rather than POS-only concerns."
    implementation_rule: "Do not implement future fiscal logic before approval; preserve primitives and record gaps."
  - id: planning-execution-boundary
    required: true
    statement: "Merchandise planning recommends ranges, allocations, replenishment, and targets; purchasing/supplier/WMS workflows execute purchase orders, receipts, landed cost, and physical movement."
    implementation_rule: "Planning recommendations must not silently execute purchasing, supplier, inventory movement, price, or external-system changes."
  - id: retailer-validation-gates-expansion
    required: true
    statement: "Synthetic Aso data validates engineering consistency only; broad expansion requires real retailer/product validation."
    implementation_rule: "Do not let roadmap automation start Phase 2C or later major modules before required pilot/product-decision gates."
  - id: phase-12-optional
    required: true
    statement: "Retail network and embedded services are optional strategic expansion, not inevitable scope."
    implementation_rule: "Phase 12 must remain optional and human-gated."
