schema_version: 1
product: RetailOS
canonical: true
status_values:
  - NOT_STARTED
  - IN_PROGRESS
  - BLOCKED
  - CONDITIONALLY_ACCEPTED
  - ACCEPTED
  - REGRESSED
validation_levels:
